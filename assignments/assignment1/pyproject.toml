[project]
name = "assignment1utils"
version = "1.0.0"
description = "Helpers, data and public checks for Programming Assignment 1 (manifold geometry) of the geometric robot learning course"
requires-python = ">=3.10"
# Everything below is preinstalled on Google Colab except geomstats. Versions are
# deliberately not pinned from above, so that pip never downgrades Colab's NumPy.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=1.5",
    "geomstats==2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assignment1utils"]
